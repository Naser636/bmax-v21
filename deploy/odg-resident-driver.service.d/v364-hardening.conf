# V364 — additional MINIMAL hardening for the L0 resident driver (drop-in; base unit unchanged).
# Syscall/resource-level only: the tick may rebuild runtime/dist and append runtime/logs, so filesystem
# protections (ProtectSystem/ProtectHome) are deliberately NOT applied. L1/L2/L3 stay inactive.
# Install:  cp deploy/odg-resident-driver.service.d/v364-hardening.conf ~/.config/systemd/user/odg-resident-driver.service.d/ && systemctl --user daemon-reload
# Rollback: rm ~/.config/systemd/user/odg-resident-driver.service.d/v364-hardening.conf && systemctl --user daemon-reload
[Service]
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
UMask=0027
Nice=10
CPUQuota=50%
MemoryMax=1G
TasksMax=128
